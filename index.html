<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duka Stock Manager</title>
<meta name="theme-color" content="#14231c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: fixed left rail of sections, working area on the right; rail becomes a scrolling top strip on phones. */
:root{
  --bg:#f3f4ef; --surface:#ffffff; --surface-2:#f8f9f5; --ink:#18211c; --muted:#5e6a62; --line:#dde2d9;
  --accent:#0b6e4f; --accent-ink:#ffffff; --accent-soft:#e0f0e8;
  --ok:#1d7a46; --ok-soft:#e3f3e8; --warn:#a15c00; --warn-soft:#fdf0d9; --bad:#b42318; --bad-soft:#fde7e4;
  --rail:#14231c; --rail-ink:#cfdcd4; --rail-active:#f2b33d;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius:10px; --shadow:0 1px 2px rgba(20,35,28,.06), 0 4px 14px rgba(20,35,28,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1512; --surface:#171f1b; --surface-2:#1c2520; --ink:#e7ede9; --muted:#9aa89f; --line:#2b3630;
    --accent:#3fb98a; --accent-ink:#06150e; --accent-soft:#163428;
    --ok:#5cc98a; --ok-soft:#173326; --warn:#f0b04a; --warn-soft:#3a2c12; --bad:#ff7b6e; --bad-soft:#3d1a17;
    --rail:#0a100d; --rail-ink:#b9c8bf; --rail-active:#f2b33d;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#171f1b; --surface-2:#1c2520; --ink:#e7ede9; --muted:#9aa89f; --line:#2b3630;
  --accent:#3fb98a; --accent-ink:#06150e; --accent-soft:#163428;
  --ok:#5cc98a; --ok-soft:#173326; --warn:#f0b04a; --warn-soft:#3a2c12; --bad:#ff7b6e; --bad-soft:#3d1a17;
  --rail:#0a100d; --rail-ink:#b9c8bf; --rail-active:#f2b33d;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:800} h2{font-size:17px;font-weight:700} h3{font-size:14px;font-weight:700}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;height:100%}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow:auto}
.brand{padding:4px 10px 16px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--display);font-size:19px;color:#fff;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:12px;opacity:.7}
.rail a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:inherit;text-decoration:none;font-weight:500;font-size:14px}
.rail a:hover{background:rgba(255,255,255,.06)}
.rail a.on{background:rgba(242,179,61,.14);color:#fff}
.rail a.on svg{color:var(--rail-active)}
.rail svg{width:18px;height:18px;flex:none;opacity:.9}
.rail .badge{margin-left:auto;background:var(--rail-active);color:#1b1300;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
.rail .foot{margin-top:auto;padding:12px 10px 0;font-size:12px;opacity:.75;display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#888;margin-right:6px;vertical-align:middle}
.dot.live{background:#3fd08a}.dot.wait{background:#f2b33d}.dot.off{background:#ff7b6e}
main{overflow:auto;padding:22px clamp(16px,3vw,32px) 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit}
a.tile:hover{border-color:var(--accent)}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:500}
.tile .v{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile.warn{border-left:4px solid var(--warn)} .tile.bad{border-left:4px solid var(--bad)} .tile.ok{border-left:4px solid var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card>.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.card .sub{color:var(--muted);font-size:13px}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td .meta{display:block;font-size:12px;color:var(--muted)}
tbody tr:hover{background:var(--surface-2)}
.empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.big{padding:13px 18px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input.qty{width:80px;text-align:right}
input.cell{width:100px;text-align:right;padding:6px 8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.banner{border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.info{background:var(--accent-soft);color:var(--accent)} .banner.bad{background:var(--bad-soft);color:var(--bad)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:0}
.li .l{min-width:0}.li .l b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
.li .l span{font-size:12.5px;color:var(--muted)}
.li .r{text-align:right;flex:none;font-variant-numeric:tabular-nums}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:16px;align-items:start}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.qbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:70px}
.qbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.qbtn b{font-size:13.5px;font-weight:600;line-height:1.25}
.qbtn span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.qbtn.out{opacity:.55}
.basket{position:sticky;top:0}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:2px solid var(--ink);margin-top:6px}
.total b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.sugg{position:relative}
.sugg-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);z-index:20;max-height:300px;overflow:auto}
.sugg-list button{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;padding:9px 12px;cursor:pointer;text-align:left;gap:10px}
.sugg-list button:hover,.sugg-list button.hl{background:var(--accent-soft)}
.sugg-list span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--body)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(560px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal.wide{width:min(820px,100%)}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:500;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:90vw}
.toast.bad{background:var(--bad);color:#fff}
.receipt{font-family:var(--mono);font-size:13px;background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:14px;white-space:pre-wrap}
.muted{color:var(--muted)} .small{font-size:13px}
.right{margin-left:auto}
.hide{display:none!important}
.mono{font-family:var(--mono)}
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--rail)}
.gate .box{background:var(--surface);border-radius:16px;padding:32px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.gate h1{font-size:26px}
.gate p{margin:0;color:var(--muted)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-weight:600;font-size:15px;cursor:pointer}
.gbtn:hover{border-color:var(--accent)}
.who{display:flex;flex-direction:column;gap:2px;word-break:break-all}
.who button{background:none;border:0;color:var(--rail-active);padding:0;text-align:left;cursor:pointer;font-size:12px;font-weight:600}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{flex-direction:row;padding:8px;gap:2px;overflow-x:auto;overflow-y:hidden}
  .brand,.rail .foot{display:none}
  .rail a{flex:none;padding:8px 10px;font-size:13px}
  .pos{grid-template-columns:1fr}
  .basket{position:static}
  main{padding-top:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="main"><p class="muted">Loading your shop…</p></main>
</div>
<div id="modal-root"></div>
<script src="firebase-config.js"></script>
<script>
/* ---------------- utilities ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 86400000;
const pad = n => String(n).padStart(2,'0');
const ymd = t => { const d = new Date(t); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const today = () => ymd(Date.now());
const startOfDay = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d).getTime(); };
const daysBetween = (a,b) => Math.round((startOfDay(b)-startOfDay(a))/DAY);
const kes = n => 'KES ' + Math.round(Number(n)||0).toLocaleString('en-KE');
const kes2 = n => (Number(n)||0).toLocaleString('en-KE',{minimumFractionDigits:0,maximumFractionDigits:2});
const qtyf = n => { n = Number(n)||0; return Number.isInteger(n) ? n.toLocaleString('en-KE') : n.toLocaleString('en-KE',{maximumFractionDigits:2}); };
const fmtDate = t => new Date(t).toLocaleDateString('en-KE',{day:'numeric',month:'short'});
const fmtDT = t => new Date(t).toLocaleString('en-KE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const fmtD = s => s ? new Date(startOfDay(s)).toLocaleDateString('en-KE',{day:'numeric',month:'short',year:'numeric'}) : '';
const num = v => { const n = parseFloat(String(v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const sum = (a,f) => a.reduce((s,x)=>s+(f?f(x):x),0);

const ICON = {
  dashboard:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  sell:'<path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M6 6 5 3H2"/>',
  products:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  'stock-in':'<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/>',
  expiry:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  credit:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
  'stock-take':'<path d="M9 4h6v3H9z"/><path d="M8 5H5v16h14V5h-3"/><path d="m9 13 2 2 4-4"/>',
  reports:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
  'shop-settings':'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>', down:'<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>'
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]||''}</svg>`;

const VIEWS = [
  ['dashboard','Dashboard'],['sell','Quick sale'],['products','Products'],['stock-in','Stock in'],
  ['expiry','Expiry'],['credit','Credit customers'],['stock-take','Stock take'],['reports','Reports'],
  ['history','History'],['shop-settings','Settings']
];
const REASONS = {damage:'Damaged',expired:'Expired',theft:'Theft / missing',own:'Own use',found:'Found / extra',count:'Stock take',other:'Other'};
const METHODS = {cash:'Cash',mpesa:'M-Pesa',credit:'Credit'};

/* ---------------- in-memory store (used only if the live store is unavailable) ---------------- */
function MemDB(){
  const store = new Map(); const subs = new Set();
  const clone = o => JSON.parse(JSON.stringify(o));
  const notify = () => setTimeout(()=>subs.forEach(f=>f()),0);
  const snap = p => { const d = store.get(p); const c = d ? clone(d) : undefined; return {id:p.split('/').pop(), exists:!!d, data:()=>c, metadata:{fromCache:false,hasPendingWrites:false}}; };
  const docRef = p => ({ id:p.split('/').pop(), path:p,
    get: async()=>snap(p),
    set: async d=>{ store.set(p, clone(d)); notify(); },
    update: async d=>{ if(!store.has(p)) throw {code:'invalid_argument',message:'missing'}; store.set(p, {...store.get(p), ...clone(d)}); notify(); },
    delete: async()=>{ store.delete(p); notify(); },
    onSnapshot(next){ const f=()=>next(snap(p)); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f); },
    collection: c => coll(p+'/'+c) });
  const cmp = (x,op,v) => op==='>'?x>v:op==='>='?x>=v:op==='<'?x<v:op==='<='?x<=v:op==='=='?x===v:op==='!='?x!==v:true;
  const query = (cp, fl=[], ord=null, lim=null) => {
    const run = () => {
      let docs = [...store.keys()].filter(k=>k.split('/').slice(0,-1).join('/')===cp).map(snap);
      fl.forEach(([f,op,v])=>{ docs = docs.filter(d=>cmp(d.data()[f],op,v)); });
      if(ord) docs.sort((a,b)=>{ const x=a.data()[ord[0]], y=b.data()[ord[0]]; return (x>y?1:x<y?-1:0)*(ord[1]==='desc'?-1:1); });
      if(lim) docs = docs.slice(0,lim);
      return {docs, size:docs.length, empty:!docs.length, docChanges:()=>[], metadata:{fromCache:false,hasPendingWrites:false}};
    };
    return { where:(f,op,v)=>query(cp,[...fl,[f,op,v]],ord,lim), orderBy:(f,d)=>query(cp,fl,[f,d||'asc'],lim), limit:n=>query(cp,fl,ord,n),
      get: async()=>run(), onSnapshot(next){ const f=()=>next(run()); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f); } };
  };
  const coll = p => Object.assign(query(p), { path:p, doc:id=>docRef(p+'/'+(id||uid())), add: async d=>{ const r=docRef(p+'/'+uid()); await r.set(d); return r; } });
  return { doc:docRef, collection:coll };
}

/* ---------------- state ---------------- */
const DEFAULT_SETTINGS = { shopName:'My Duka', expiryWarnDays:30, deadDays:14, coverDays:7, archiveDays:180 };
const S = {
  products:{}, batches:{}, sales:[], receipts:[], adjustments:[], customers:{}, payments:[], stocktakes:[], summaries:{},
  settings:{...DEFAULT_SETTINGS}, staff:{}, role:null, email:null, pending:false, loadedProducts:false, loaded:new Set(), status:'wait', mode:'live', canWrite:true, me:null
};
let db = null;
const UI = {
  view:'dashboard',
  prodSearch:'', prodCat:'', prodStatus:'',

/* ---------------- derived data ---------------- */
function activeProducts(){ return Object.values(S.products).filter(p=>!p.archived).sort((a,b)=>a.name.localeCompare(b.name)); }
function salesStats(){
  // quantity sold per product over the last 30 days (from loaded sales)
  const since = Date.now()-30*DAY; const per = {}; let first = Date.now();
  S.sales.forEach(s=>{ if(s.ts>=since){ first = Math.min(first, s.ts); (s.items||[]).forEach(i=>{ per[i.pid]=(per[i.pid]||0)+num(i.qty); }); } });
  // average over 30 days, or over the days since the first recorded sale for a new shop (at least 7)
  per._days = Math.min(30, Math.max(7, Math.ceil((Date.now()-first)/DAY)));
  return per;
}
function analyse(){
  const per = salesStats(); const set = S.settings; const t = Date.now();
  return activeProducts().map(p=>{
    const sold30 = per[p.id]||0; const avg = sold30/per._days; const stock = num(p.stock);
    const cover = avg>0 ? stock/avg : Infinity;
    const lead = num(p.leadDays)||2; const reorder = num(p.reorder);
    let status = 'ok';
    if(stock<=0) status='out'; else if(stock<=reorder || cover<=lead) status='low';
    const target = avg>0 ? Math.ceil(avg*(lead+num(set.coverDays))) : reorder*2;
    const suggest = Math.max(0, Math.max(target, reorder+1) - stock);
    const idle = p.lastSold ? Math.floor((t-p.lastSold)/DAY) : null;
    const dead = stock>0 && (idle===null ? (p.created && (t-p.created)/DAY>num(set.deadDays)) : idle>=num(set.deadDays));
    return {...p, sold30, avg, cover, status, suggest, idle, dead, value:stock*num(p.cost)};
  });
}
function batchList(){
  const warn = num(S.settings.expiryWarnDays); const td = today();
  return Object.values(S.batches).filter(b=>num(b.qty)>0 && S.products[b.pid] && !S.products[b.pid].archived).map(b=>{
    const d = daysBetween(td, b.expiry); const p = S.products[b.pid];
    const st = d<0?'expired':d<=7?'week':d<=warn?'soon':'ok';
    return {...b, days:d, st, name:p.name, unit:p.unit, value:num(b.qty)*num(p.cost)};
  }).sort((a,b)=>a.expiry.localeCompare(b.expiry));
}
function statusPill(s){
  return s==='out'?'<span class="pill bad">Out</span>':s==='low'?'<span class="pill warn">Low</span>':'<span class="pill ok">OK</span>';
}
function expiryPill(b){
  if(b.st==='expired') return `<span class="pill bad">Expired ${-b.days}d ago</span>`;
  if(b.days===0) return '<span class="pill bad">Expires today</span>';
  if(b.st==='week') return `<span class="pill bad">${b.days}d left</span>`;
  if(b.st==='soon') return `<span class="pill warn">${b.days}d left</span>`;
  return `<span class="pill ok">${b.days}d left</span>`;
}
function owedTotal(){ return sum(Object.values(S.customers), c=>Math.max(0,num(c.balance))); }

/* ---------- Dashboard ---------- */
function barChart(days){
  const W=960, H=210, padL=44, padB=26, padT=12;
  const max = Math.max(1, ...days.map(d=>d.v));
  const step = niceStep(max/4); const top = Math.ceil(max/step)*step;
  const bw = (W-padL-8)/days.length;
  const y = v => padT + (H-padT-padB)*(1-v/top);
  let g = '';
  for(let v=0; v<=top+1e-9; v+=step){ g += `<line x1="${padL}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?(v/1000)+'k':v}</text>`; }
  const bars = days.map((d,i)=>{ const x = padL + i*bw + bw*0.18, w = bw*0.64, yy = y(d.v), last = i===days.length-1;
    return `<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(0,H-padB-yy)}" rx="3" fill="var(--accent)" opacity="${last?1:.55}"><title>${d.label}: ${kes(d.v)}</title></rect>` +
      `<text x="${x+w/2}" y="${H-7}" text-anchor="middle" ${last?'style="fill:var(--ink);font-weight:600"':''}>${d.short}</text>`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily sales, last ${days.length} days">${g}${bars}</svg></div>`;
}
function niceStep(x){ if(x<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))); const m = x/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; }

  q = q.trim().toLowerCase(); if(!q) return [];

  return all.filter(p=>p.name.toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q)).slice(0,limit);
}

/* ---------- Reports ---------- */
async function loadReport(){
  const r = UI.rep; r.loading = true; schedule();
  try{
    const from = startOfDay(r.from), to = startOfDay(r.to)+DAY;
    const [ss, aa, pp] = await Promise.all([
      db.collection('sales').where('ts','>=',from).where('ts','<',to).limit(1000).get(),
      db.collection('adjustments').where('ts','>=',from).where('ts','<',to).limit(1000).get(),
      db.collection('payments').where('ts','>=',from).where('ts','<',to).limit(1000).get()
    ]);
    r.data = { sales: ss.docs.map(d=>({id:d.id,...d.data()})), adj: aa.docs.map(d=>({id:d.id,...d.data()})), pay: pp.docs.map(d=>({id:d.id,...d.data()})), capped: ss.size>=1000 };
  }catch(e){ toast(errMsg(e), true); r.data = null; }
  r.loading = false; schedule();
}
function reportCalc(){
  const d = UI.rep.data; if(!d) return null;
  const rev = sum(d.sales,s=>num(s.total)), cost = sum(d.sales,s=>num(s.costTotal));
  const byM = {}; d.sales.forEach(s=>byM[s.method]=(byM[s.method]||0)+num(s.total));
  const byP = {}, byC = {};
  d.sales.forEach(s=>(s.items||[]).forEach(i=>{ const k=i.pid; const p=S.products[k]; const cat=(p&&p.category)||'Uncategorised';
    byP[k]=byP[k]||{name:i.name,cat,qty:0,rev:0,cost:0}; byP[k].qty+=num(i.qty); byP[k].rev+=num(i.qty)*num(i.price); byP[k].cost+=num(i.qty)*num(i.cost);
    byC[cat]=byC[cat]||{rev:0,cost:0}; byC[cat].rev+=num(i.qty)*num(i.price); byC[cat].cost+=num(i.qty)*num(i.cost); }));
  const losses = d.adj.filter(a=>num(a.qty)<0); const lossVal = -sum(losses,a=>num(a.value));
  const byR = {}; losses.forEach(a=>byR[a.reason]=(byR[a.reason]||0)-num(a.value));
  const days = Math.max(1, daysBetween(UI.rep.from, UI.rep.to)+1);
  return {rev,cost,gp:rev-cost,count:d.sales.length,byM,byP:Object.values(byP).sort((a,b)=>b.rev-a.rev),byC:Object.entries(byC).sort((a,b)=>b[1].rev-a[1].rev),lossVal,byR,paid:sum(d.pay,p=>num(p.amount)),days};
}

/* ---------------- modal + toast ---------------- */
function openModal(html, wide=false){
  $('#modal-root').innerHTML = `<div class="scrim" data-act="scrim"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f = $('#modal-root input:not([type=hidden]), #modal-root select'); if(f) f.focus();
}
function closeModal(){ $('#modal-root').innerHTML = ''; }
let toastT;
function toast(msg, bad=false){ let t = $('.toast'); if(!t){ t = document.createElement('div'); document.body.appendChild(t); } t.className = 'toast'+(bad?' bad':''); t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), bad?6000:2800); }
function errMsg(e){
  const c = e && e.code;
  if(c==='permission-denied') return 'You are not allowed to change this. Ask the shop owner to add your email under Settings > Staff.';
  if(c==='resource-exhausted') return 'Firebase usage limit reached for today. Try again later or upgrade the Firebase plan.';
  if(c==='unauthenticated') return 'Your sign-in expired. Reload the page and sign in again.';
  if(c==='invalid_argument') return S.canWrite ? 'That change could not be saved. Check the values and try again.' : 'You have view-only access, so this was not saved.';
  if(c==='quota_exceeded') return 'Storage is full. Archive old records in Settings, then try again.';
  if(c==='resource_exhausted') return 'Too many changes at once. Wait a moment and try again.';
  if(c==='revoked') return 'Your access to this shop changed. Reload the page.';
  return 'Could not save right now. Check your connection and try again.';
}
function confirmBox(title, text, okLabel='Confirm', danger=false){
  return new Promise(res=>{
    openModal(`<h2>${title}</h2><p class="muted" style="margin:0">${text}</p><div class="mf"><button class="btn" id="cb-no">Cancel</button><button class="btn ${danger?'danger':'pri'}" id="cb-yes">${okLabel}</button></div>`);
    $('#cb-no').onclick = ()=>{ closeModal(); res(false); };
    $('#cb-yes').onclick = ()=>{ closeModal(); res(true); };
  });
}
let busy = false;
async function guarded(fn){ if(busy) return; busy = true; try{ await fn(); }catch(e){ console.error(e); toast(errMsg(e), true); } finally{ busy = false; } }

/* ---------------- write operations ---------------- */
async function retry(fn){ try{ return await fn(); }catch(e){ if(e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); return fn(); } throw e; } }
const upd = (path, data) => retry(()=>db.doc(path).update(data));
const add = (col, data) => retry(()=>db.collection(col).add(data));

async function depleteBatches(pid, qty){
  let left = qty;
  const bs = Object.values(S.batches).filter(b=>b.pid===pid && num(b.qty)>0).sort((a,b)=>a.expiry.localeCompare(b.expiry));
  for(const b of bs){ if(left<=0) break; const take = Math.min(num(b.qty), left); left -= take; await upd('batches/'+b.id, {qty: +(num(b.qty)-take).toFixed(3)}); }
}
async function changeStock(pid, delta, extra={}){
  const p = S.products[pid]; if(!p) return;
  await upd('products/'+pid, {stock: +(num(p.stock)+delta).toFixed(3), ...extra});
  if(delta<0 && p.tracksExpiry) await depleteBatches(pid, -delta);
}

async function completeSale(){
  if(!UI.basket.length) return;
  const lines = UI.basket.filter(l=>num(l.qty)>0);
  if(!lines.length){ toast('Set a quantity for at least one item.', true); return; }
  const m = UI.payMethod; let cust = null;
  if(m==='credit'){ cust = S.customers[UI.saleCust]; if(!cust){ toast('Choose the customer for this credit sale.', true); return; } }
  const ts = Date.now();
  const items = lines.map(l=>({pid:l.pid, name:l.name, qty:num(l.qty), price:num(l.price), cost:num((S.products[l.pid]||{}).cost)}));
  const total = sum(items,i=>i.qty*i.price), costTotal = sum(items,i=>i.qty*i.cost);
  const sale = {ts, date:ymd(ts), items, total, costTotal, method:m, by:S.me||null};
  if(cust){ sale.cid = cust.id; sale.cname = cust.name; }
  if(m==='mpesa' && UI.saleRef.trim()) sale.ref = UI.saleRef.trim().toUpperCase();
  if(m==='cash' && num(UI.tendered)>0) sale.tendered = num(UI.tendered);
  await add('sales', sale);
  for(const i of items) await changeStock(i.pid, -i.qty, {lastSold: ts});
  if(cust) await upd('customers/'+cust.id, {balance: num(cust.balance)+total, lastTs: ts});
  UI.lastSale = sale; UI.basket = []; UI.saleSearch=''; UI.saleRef=''; UI.tendered=''; UI.saleCust=''; UI.payMethod='cash';
  schedule();
}
function addToBasket(pid){
  const p = S.products[pid]; if(!p) return;
  const ex = UI.basket.find(l=>l.pid===pid);
  if(ex) ex.qty = num(ex.qty)+1; else UI.basket.push({pid, name:p.name, price:num(p.price), qty:1});
  UI.saleSearch=''; const s=$('#sale-search'); if(s) s.value='';
  schedule(); setTimeout(()=>{ const s=$('#sale-search'); if(s) s.focus(); },30);
}

async function saveStockIn(){
  const si = UI.stockIn; const lines = si.lines.filter(l=>num(l.qty)>0);
  if(!lines.length){ toast('Enter the quantity received for at least one item.', true); return; }
  const missing = lines.find(l=>S.products[l.pid]?.tracksExpiry && !l.expiry);
  if(missing && !(await confirmBox('No expiry date', `${esc(S.products[missing.pid].name)} tracks expiry but has no date. Save anyway? That stock won't show on the Expiry page.`, 'Save anyway'))) return;
  const ts = si.date===today() ? Date.now() : startOfDay(si.date)+12*3600000;
  const items = lines.map(l=>({pid:l.pid, name:S.products[l.pid]?.name||l.name, qty:num(l.qty), cost:num(l.cost), expiry:l.expiry||null}));
  await add('receipts', {ts, date:si.date, supplier:si.supplier.trim(), invoice:si.invoice.trim(), items, total:sum(items,i=>i.qty*i.cost), by:S.me||null});
  for(const i of items){
    const p = S.products[i.pid]; const extra = {};
    if(i.cost>0) extra.cost = i.cost;
    if(si.supplier.trim() && !p.supplier) extra.supplier = si.supplier.trim();
    await changeStock(i.pid, i.qty, extra);
    if(i.expiry && p.tracksExpiry) await add('batches', {pid:i.pid, qty:i.qty, expiry:i.expiry, received:ts});
  }
  UI.stockIn = {supplier:'', invoice:'', date:today(), lines:[]};
  toast(`Delivery saved: ${items.length} item${items.length===1?'':'s'}, ${kes(sum(items,i=>i.qty*i.cost))}.`);
  schedule();
}

async function postCount(){
  const entries = Object.entries(UI.count).filter(([id,v])=>v!=='' && S.products[id]);
  const lines = entries.map(([id,v])=>{ const p=S.products[id]; return {pid:id, name:p.name, system:num(p.stock), counted:num(v), diff:+(num(v)-num(p.stock)).toFixed(3), cost:num(p.cost)}; });
  const vars = lines.filter(l=>l.diff!==0); const tv = sum(vars,l=>l.diff*l.cost);
  if(!(await confirmBox('Post stock take?', `${lines.length} items counted, ${vars.length} with a difference worth ${kes(tv)}. Stock will be set to your counts.`, 'Post stock take'))) return;
  const ts = Date.now();
  for(const l of vars){
    await add('adjustments', {ts, date:ymd(ts), pid:l.pid, name:l.name, qty:l.diff, reason:'count', value:l.diff*l.cost, note:`System ${qtyf(l.system)}, counted ${qtyf(l.counted)}`, by:S.me||null});
    await changeStock(l.pid, l.diff);
  }
  await add('stocktakes', {ts, date:ymd(ts), lines, totalValue:tv, by:S.me||null});
  UI.count = {}; toast('Stock take posted.'); schedule();
}

/* ---------------- CSV / export ---------------- */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ row.push(cur); cur=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=ch; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
const csvCell = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
const toCSV = rows => rows.map(r=>r.map(csvCell).join(',')).join('\n');
async function importCSV(file){
  const rows = parseCSV(await file.text()); if(rows.length<2){ toast('That file has no product rows.', true); return; }
  const hdr = rows[0].map(h=>h.trim().toLowerCase().replace(/[^a-z]/g,''));
  const col = n => hdr.indexOf(n.toLowerCase());
  if(col('name')<0){ toast('The CSV needs a "name" column. See Settings for the format.', true); return; }
  const get = (r,n) => { const i=col(n); return i<0 ? undefined : (r[i]??'').trim(); };
  let added=0, updated=0;
  for(const r of rows.slice(1)){
    const name = get(r,'name'); if(!name) continue;
    const sku = get(r,'sku')||get(r,'barcode')||'';
    const data = {name};
    [['category','category'],['unit','unit'],['supplier','supplier']].forEach(([k,c])=>{ const v=get(r,c); if(v!==undefined) data[k]=v; });
    [['cost','cost'],['price','price'],['reorder','reorder'],['leadDays','leaddays']].forEach(([k,c])=>{ const v=get(r,c); if(v!==undefined && v!=='') data[k]=num(v); });
    const te = get(r,'tracksexpiry'); if(te!==undefined) data.tracksExpiry = /^(y|yes|true|1)$/i.test(te);
    const ex = (sku && Object.values(S.products).find(p=>p.sku===sku)) || Object.values(S.products).find(p=>p.name.toLowerCase()===name.toLowerCase());
    const st = get(r,'stock');
    if(ex){ if(st!==undefined && st!=='') data.stock = num(st); await upd('products/'+ex.id, {...data, sku:sku||ex.sku||''}); updated++; }
    else { const ref = db.collection('products').doc(); await retry(()=>ref.set({unit:'pcs',category:'',supplier:'',cost:0,price:0,reorder:5,leadDays:2,tracksExpiry:false, ...data, sku, id:ref.id, stock:num(st), created:Date.now(), archived:false})); added++; }
  }
  toast(`Import done: ${added} added, ${updated} updated.`);
}
async function offerFile(filename, data){
  try{ const type = filename.endsWith('.json')?'application/json':'text/csv';
    const url = URL.createObjectURL(new Blob(['\ufeff'+data],{type:type+';charset=utf-8'}));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000); return; }catch(e){}
  try{ await navigator.clipboard.writeText(data); toast('Downloads aren\'t available here, so the data was copied. Paste it into Excel or a text file.'); }
  catch(e){ toast('Could not export from this view.', true); }
}
async function copyText(t, msg='Copied.'){ try{ await navigator.clipboard.writeText(t); toast(msg); }catch(e){ toast('Copy was blocked. Select the text and copy it manually.', true); } }

async function archiveOld(){
  const days = Math.max(60, num($('#set-arch')?.value || S.settings.archiveDays));
  const cutoff = startOfDay(ymd(Date.now()-days*DAY));
  const [ss, rr, aa] = await Promise.all([
    db.collection('sales').where('ts','<',cutoff).limit(500).get(),
    db.collection('receipts').where('ts','<',cutoff).limit(500).get(),
    db.collection('adjustments').where('ts','<',cutoff).limit(500).get() ]);
  const n = ss.size+rr.size+aa.size;
  if(!n){ toast(`Nothing older than ${days} days to archive.`); return; }
  if(!(await confirmBox('Archive old records?', `${ss.size} sales, ${rr.size} deliveries and ${aa.size} adjustments older than ${days} days will be rolled into monthly totals and removed. Credit statements keep working from customer balances.`, 'Archive'))) return;
  const months = {};
  const mk = t => ymd(t).slice(0,7);
  ss.docs.forEach(d=>{ const s=d.data(); const m=months[mk(s.ts)] ||= {revenue:0,cost:0,count:0,losses:0,received:0}; m.revenue+=num(s.total); m.cost+=num(s.costTotal); m.count++; });
  rr.docs.forEach(d=>{ const r=d.data(); const m=months[mk(r.ts)] ||= {revenue:0,cost:0,count:0,losses:0,received:0}; m.received+=num(r.total); });
  aa.docs.forEach(d=>{ const a=d.data(); const m=months[mk(a.ts)] ||= {revenue:0,cost:0,count:0,losses:0,received:0}; if(num(a.value)<0) m.losses+=-num(a.value); });
  for(const [k,m] of Object.entries(months)){
    const ex = S.summaries[k] || {revenue:0,cost:0,count:0,losses:0,received:0};
    await retry(()=>db.doc('summaries/'+k).set({month:k, revenue:num(ex.revenue)+m.revenue, cost:num(ex.cost)+m.cost, count:num(ex.count)+m.count, losses:num(ex.losses)+m.losses, received:num(ex.received)+m.received}));
  }
  for(const d of [...ss.docs.map(x=>'sales/'+x.id), ...rr.docs.map(x=>'receipts/'+x.id), ...aa.docs.map(x=>'adjustments/'+x.id)]) await retry(()=>db.doc(d).delete());
  if(days!==num(S.settings.archiveDays)) await saveSettings({archiveDays:days});
  toast(`Archived ${n} records into ${Object.keys(months).length} monthly totals.`);
}

/* ---------------- data wiring ---------------- */
function subscribe(){
  const since = Date.now()-35*DAY;
  let loadTimer = setTimeout(()=>{ if(S.status!=='live'){ S.status='off'; schedule(); } }, 10000);
  const pend = {};
  const live = (snap, key) => {
    if(!snap || !snap.metadata) return;
    if(key){ pend[key] = snap.metadata.hasPendingWrites; S.pending = Object.values(pend).some(Boolean); }
    if(!snap.metadata.fromCache){ if(S.status!=='live'){ S.status='live'; clearTimeout(loadTimer); } }
    else if(S.status==='live' && S.mode==='live' && !navigator.onLine){ S.status='off'; }
  };
  window.addEventListener('online', ()=>{ if(S.status==='off') { S.status='wait'; schedule(); } });
  window.addEventListener('offline', ()=>{ S.status='off'; schedule(); });
  const onErr = e => { console.warn(e); if(e && e.code==='permission-denied' && S.mode==='live'){ showNotApproved(S.email); return; } S.status = S.status==='live'?'live':'off'; clearTimeout(loadTimer); schedule(); };
  const toMap = snap => { const m={}; snap.docs.forEach(d=>{ m[d.id] = {id:d.id, ...d.data()}; }); return m; };
  const toArr = snap => snap.docs.map(d=>({id:d.id, ...d.data()}));
  db.collection('products').onSnapshot(s=>{ S.products = toMap(s); S.loadedProducts = true; live(s,'p'); schedule(); }, onErr);
  db.collection('batches').where('qty','>',0).onSnapshot(s=>{ S.batches = toMap(s); live(s,'b'); schedule(); }, onErr);
  db.collection('customers').onSnapshot(s=>{ S.customers = toMap(s); live(s,'c'); schedule(); }, onErr);
  db.collection('sales').where('ts','>=',since).orderBy('ts','desc').limit(1000).onSnapshot(s=>{ S.sales = toArr(s); live(s,'s'); schedule(); }, onErr);
  db.collection('receipts').orderBy('ts','desc').limit(300).onSnapshot(s=>{ S.receipts = toArr(s); live(s,'r'); schedule(); }, onErr);
  db.collection('adjustments').orderBy('ts','desc').limit(300).onSnapshot(s=>{ S.adjustments = toArr(s); live(s,'a'); schedule(); }, onErr);
  db.collection('payments').orderBy('ts','desc').limit(300).onSnapshot(s=>{ S.payments = toArr(s); live(s,'pay'); schedule(); }, onErr);
  db.collection('stocktakes').orderBy('ts','desc').limit(20).onSnapshot(s=>{ S.stocktakes = toArr(s); live(s); schedule(); }, onErr);
  db.collection('summaries').onSnapshot(s=>{ S.summaries = toMap(s); live(s); schedule(); }, onErr);
  if(S.mode==='live') db.collection('staff').onSnapshot(s=>{ S.staff = toMap(s); schedule(); }, e=>console.warn(e));
  db.doc('settings/main').onSnapshot(s=>{ S.settings = {...DEFAULT_SETTINGS, ...(s.exists?s.data():{})}; live(s); schedule(); }, onErr);
}
/* ---------------- Firebase ---------------- */
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
let FB = null;
function FireDB(F, fs){
  // Same small API the app uses everywhere (doc / collection / where / orderBy / limit / get / onSnapshot / set / update / delete / add).
  // Writes are applied to the local cache immediately and synced in the background, so the till keeps working offline.
  const bg = p => { p.catch(e=>{ console.error(e); toast(errMsg(e), true); }); return Promise.resolve(); };
  const wDoc = x => ({ id:x.id, exists:x.exists(), data:()=>x.data(), metadata:x.metadata });
  const wQ = q => ({ docs:q.docs.map(wDoc), size:q.size, empty:q.empty, metadata:q.metadata });
  const opts = { includeMetadataChanges:true };
  const docRef = path => { const r = F.doc(fs, path); return { id:r.id, path:r.path,
    get: async()=>wDoc(await F.getDoc(r)),
    set: d=>bg(F.setDoc(r, d)), update: d=>bg(F.updateDoc(r, d)), delete: ()=>bg(F.deleteDoc(r)),
    onSnapshot: (n,e)=>F.onSnapshot(r, opts, x=>n(wDoc(x)), e),
    collection: c=>coll(r.path+'/'+c) }; };
  const query = (cp, cons=[]) => { const q = () => F.query(F.collection(fs, cp), ...cons); return {
    where:(f,op,v)=>query(cp,[...cons,F.where(f,op,v)]), orderBy:(f,d)=>query(cp,[...cons,F.orderBy(f,d||'asc')]), limit:n=>query(cp,[...cons,F.limit(n)]),
    get: async()=>wQ(await F.getDocs(q())), onSnapshot:(n,e)=>F.onSnapshot(q(), opts, x=>n(wQ(x)), e) }; };
  const coll = p => Object.assign(query(p), { path:p,
    doc: id => id ? docRef(p+'/'+id) : docRef(F.doc(F.collection(fs, p)).path),
    add: async d => { const r = docRef(F.doc(F.collection(fs, p)).path); await r.set(d); return r; } });
  return { doc:docRef, collection:coll };
}

  gate(`<h1>Almost there</h1><p>Firebase isn't configured yet. Open <code>firebase-config.js</code> in your GitHub repo, paste your Firebase web app config, and commit (see README.md in the repo).</p><a class="btn pri" href="?demo">Try the demo instead</a>`);

async function startApp(store, mode){
  db = store; S.mode = mode; if(mode==='memory'){ S.status='live'; }
  route(); subscribe(); schedule();
}
async function boot(){
  if(new URLSearchParams(location.search).has('demo')){ const m = MemDB(); await loadSampleInto(m); S.role='owner'; return startApp(m, 'memory'); }
  const cfg = window.FIREBASE_CONFIG;
  if(!cfg || !cfg.apiKey || String(cfg.apiKey).startsWith('PASTE')) return showSetup();
  const [A, Au, F] = await Promise.all([import(SDK+'firebase-app.js'), import(SDK+'firebase-auth.js'), import(SDK+'firebase-firestore.js')]);
  const app = A.initializeApp(cfg);
  let fs;
  try{ fs = F.initializeFirestore(app, { ignoreUndefinedProperties:true, localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch(e){ console.warn('Offline cache unavailable', e); fs = F.getFirestore(app); }
  const auth = Au.getAuth(app);
  FB = { auth, ...Au };
  Au.getRedirectResult(auth).catch(e=>console.warn(e));
  let started = false;
  Au.onAuthStateChanged(auth, async u => {
    if(!u){ if(started) location.reload(); else showSignIn(); return; }
    if(started) return;
    const email = (u.email||'').toLowerCase();
    const store = FireDB(F, fs);
    // Access check: approved staff have a staff/<email> document. The owner (named in firestore.rules) creates their own on first sign-in.
    let me = null;
    try{
      const sd = await store.doc('staff/'+email).get();
      if(sd.exists) me = sd.data();
      else { await F.setDoc(F.doc(fs, 'staff/'+email), {role:'owner', name:u.displayName||'', added:Date.now()}); me = {role:'owner'}; }
    }catch(e){
      if(e && e.code==='permission-denied') return showNotApproved(email);
      if(e && e.code==='unavailable'){ me = {role:'staff'}; } // offline on first load: open from the device cache
      else return showSignIn('Could not check your access: '+(e.message||e.code));
    }
    started = true;
    S.me = email; S.email = email; S.role = me.role || 'staff';
    document.body.innerHTML = `<div class="app"><nav class="rail" id="rail" aria-label="Sections"></nav><main id="main"><p class="muted">Loading your shop…</p></main></div><div id="modal-root"></div>`;
    startApp(store, 'live');
  });
}
boot();
